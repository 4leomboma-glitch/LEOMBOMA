---
# Déploiement automatique cPanel : copie le site vitrine (dossier site/) dans la racine du domaine innovibe.cd.
# Dans cPanel > Git Version Control > Manage > Pull or Deploy > "Update from Remote" puis "Deploy HEAD Commit".
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/innovibe.cd/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R site/. $DEPLOYPATH
